name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-and-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.2.0'
      - name: Install pinned formatters
        run: |
          python -m pip install -r scripts/requirements-style.txt
          python scripts/install_shfmt.py
      - name: Check code style
        run: python scripts/style.py
      - name: Check tools and source boundaries
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check

  spatial-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test spatial algorithms
        run: swift test --package-path Packages/SpatialCore --scratch-path "$RUNNER_TEMP/SpatialCore"
      - name: Test imported contracts
        run: PRTS_CONTRACTS_ONLY=1 swift test --package-path Vendor/PRTSCore --scratch-path "$RUNNER_TEMP/Contracts"
