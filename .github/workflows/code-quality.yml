name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-and-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.2.0'
      - name: Install pinned formatters
        run: |
          python -m pip install -r scripts/requirements-style.txt
          python scripts/install_shfmt.py
      - name: Check code style
        run: python scripts/style.py
      - name: Check tools and source boundaries
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check

  spatial-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test spatial algorithms
        run: swift test --package-path Packages/SpatialCore --scratch-path "$RUNNER_TEMP/SpatialCore"
      - name: Test imported contracts
        run: PRTS_CONTRACTS_ONLY=1 swift test --package-path Vendor/PRTSCore --scratch-path "$RUNNER_TEMP/Contracts"

  app-build:
    # Compile check only: a header-only LocalVLM stub replaces llama.cpp and the weights are
    # empty files, so the app links with undefined model symbols and is never run.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Stub the local model library
        run: |
          stub="$RUNNER_TEMP/LocalVLMStub"
          mkdir -p "$stub/include" models/MiniCPM-V-4.7-1B
          cp Packages/LocalVLM/csrc/prts_local_vlm.h Packages/LocalVLM/csrc/module.modulemap "$stub/include/"
          echo | xcrun --sdk iphoneos clang -x c -target arm64-apple-ios17.0 -c - -o "$stub/empty.o"
          xcrun libtool -static -o "$stub/libPRTSLocalVLM.a" "$stub/empty.o"
          xcodebuild -create-xcframework -output Packages/LocalVLM/PRTSLocalVLM.xcframework \
            -library "$stub/libPRTSLocalVLM.a" -headers "$stub/include"
          touch models/MiniCPM-V-4.7-1B/MiniCPM-V-4_7-1B-Q5_K_M.gguf
          touch models/MiniCPM-V-4.7-1B/mmproj-model-f16.gguf
      - name: Compile the app and test targets
        run: >-
          xcodebuild -project PRTS.xcodeproj -scheme PRTS -configuration Debug
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/App"
          CODE_SIGNING_ALLOWED=NO DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO
          'OTHER_LDFLAGS=$(inherited) -Wl,-undefined,dynamic_lookup' build-for-testing
